<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="hungBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="hungCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hungSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="hungHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="hungShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#hungBg)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>

  <!-- Subtle Medical Crosses -->
  <path d="M200,45 L200,85 M180,65 L220,65" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M70,160 L70,190 M55,175 L85,175" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M330,160 L330,190 M315,175 L345,175" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Shoulders and Doctor Coat -->
  <path d="M70,395 C70,290 120,255 200,255 C280,255 330,290 330,395 Z" fill="url(#hungCoat)" filter="url(#hungShadow)"/>

  <!-- Shirt & Tie -->
  <polygon points="170,255 230,255 200,320" fill="#0284c7"/>
  <polygon points="190,260 210,260 205,335 195,335" fill="#1e3a8a"/>

  <!-- Doctor Coat Collars (Lapels) -->
  <path d="M120,275 L180,370 L195,300 L160,255 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M280,275 L220,370 L205,300 L240,255 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Stethoscope -->
  <path d="M145,265 C145,340 185,365 200,365 C215,365 255,340 255,265" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="370" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
  <circle cx="200" cy="370" r="4" fill="#10b981"/>

  <!-- Neck -->
  <rect x="180" y="195" width="40" height="65" rx="8" fill="url(#hungSkin)"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="155" rx="52" ry="62" fill="url(#hungSkin)"/>

  <!-- Male Neat Hair -->
  <path d="M145,145 C145,85 175,70 200,70 C235,70 255,85 255,145 C250,115 235,100 200,100 C165,100 150,120 145,145 Z" fill="url(#hungHair)"/>

  <!-- Eyebrows -->
  <path d="M165,135 Q180,130 190,135" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M210,135 Q220,130 235,135" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Glasses -->
  <rect x="160" y="142" width="32" height="22" rx="6" fill="#ffffff" fill-opacity="0.25" stroke="#334155" stroke-width="2.5"/>
  <rect x="208" y="142" width="32" height="22" rx="6" fill="#ffffff" fill-opacity="0.25" stroke="#334155" stroke-width="2.5"/>
  <line x1="192" y1="152" x2="208" y2="152" stroke="#334155" stroke-width="2.5"/>
  <line x1="160" y1="150" x2="148" y2="146" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="150" x2="252" y2="146" stroke="#334155" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="176" cy="153" r="3.5" fill="#0f172a"/>
  <circle cx="224" cy="153" r="3.5" fill="#0f172a"/>

  <!-- Nose -->
  <path d="M198,162 Q202,174 196,177 L204,177" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Confident Smile -->
  <path d="M182,190 Q200,205 218,190" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M186,190 Q200,198 214,190" fill="#ffffff"/>
</svg>
