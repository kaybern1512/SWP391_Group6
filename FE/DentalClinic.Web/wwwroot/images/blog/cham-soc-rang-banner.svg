<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgHygiene" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgHygiene)"/>

  <!-- Dental Arch Section (Lower Front Teeth & Pink Gums) -->
  <g transform="translate(360, 210)">
    <!-- Gums / Loi nha chu -->
    <path d="M-180,60 C-100,10 100,10 180,60 L180,140 L-180,140 Z" fill="#fb7185" stroke="#f43f5e" stroke-width="2"/>

    <!-- Front Teeth -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="-70" y="5" width="30" height="55" rx="8"/>
      <rect x="-35" y="0" width="32" height="60" rx="8"/>
      <rect x="3" y="0" width="32" height="60" rx="8"/>
      <rect x="40" y="5" width="30" height="55" rx="8"/>
      <rect x="-105" y="15" width="28" height="50" rx="8"/>
      <rect x="75" y="15" width="28" height="50" rx="8"/>
    </g>

    <!-- Foamy Bubbles (Bọt kem đánh răng) -->
    <circle cx="-20" cy="25" r="9" fill="#ffffff" opacity="0.8"/>
    <circle cx="5" cy="18" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="30" r="8" fill="#ffffff" opacity="0.75"/>
    <circle cx="-50" cy="32" r="7" fill="#ffffff" opacity="0.85"/>

    <!-- Modern Ergonomic Toothbrush (Chải 45 độ chuẩn Bass) -->
    <g transform="translate(80, -20) rotate(-25)">
      <!-- Handle -->
      <path d="M-15,-20 L240,-50 C250,-52 260,-40 255,-30 L0,15 Z" fill="url(#brushGrad)" stroke="#0284c7" stroke-width="2"/>
      <!-- Head -->
      <rect x="-75" y="0" width="75" height="18" rx="8" fill="#0284c7"/>
      <!-- Soft Bristles -->
      <g fill="#38bdf8" stroke="#0284c7" stroke-width="0.5">
        <rect x="-70" y="18" width="12" height="22" rx="2"/>
        <rect x="-55" y="18" width="12" height="22" rx="2" fill="#ffffff"/>
        <rect x="-40" y="18" width="12" height="22" rx="2"/>
        <rect x="-25" y="18" width="12" height="22" rx="2" fill="#ffffff"/>
        <rect x="-10" y="18" width="10" height="22" rx="2"/>
      </g>
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(40, 370)">
    <rect width="360" height="50" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">CHĂM SÓC RĂNG MIỆNG CHUẨN NHA KHOA</text>
    <text x="20" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#94a3b8">Kỹ thuật chải răng Bass & Chỉ nha khoa ngăn ngừa sâu răng</text>
  </g>
</svg>