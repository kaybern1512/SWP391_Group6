<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgOrtho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgOrtho)"/>

  <!-- Dental Arch / Teeth Arc -->
  <g transform="translate(400, 200)">
    <!-- Arch Curve Base -->
    <path d="M-220,100 C-220,-80 220,-80 220,100" fill="none" stroke="#e0e7ff" stroke-width="50" opacity="0.3"/>
    
    <!-- White Teeth Series along curve -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <!-- Centrals -->
      <rect x="-24" y="-80" width="22" height="36" rx="6"/>
      <rect x="2" y="-80" width="22" height="36" rx="6"/>
      <!-- Laterals -->
      <rect x="-52" y="-76" width="20" height="34" rx="6"/>
      <rect x="32" y="-76" width="20" height="34" rx="6"/>
      <!-- Canines -->
      <rect x="-80" y="-68" width="22" height="36" rx="8"/>
      <rect x="58" y="-68" width="22" height="36" rx="8"/>
      <!-- Premolars -->
      <rect x="-114" y="-50" width="24" height="35" rx="8"/>
      <rect x="90" y="-50" width="24" height="35" rx="8"/>
      <rect x="-150" y="-20" width="26" height="38" rx="8"/>
      <rect x="124" y="-20" width="26" height="38" rx="8"/>
      <!-- Molars -->
      <rect x="-188" y="20" width="30" height="42" rx="10"/>
      <rect x="158" y="20" width="30" height="42" rx="10"/>
      <rect x="-222" y="70" width="32" height="44" rx="10"/>
      <rect x="190" y="70" width="32" height="44" rx="10"/>
    </g>

    <!-- Transparent Invisalign Aligner Overlay with Specular Highlights -->
    <path d="M-230,118 C-235,-95 235,-95 230,118" fill="none" stroke="url(#trayGrad)" stroke-width="58" stroke-linecap="round" opacity="0.85"/>
    <path d="M-225,115 C-230,-90 230,-90 225,115" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="15,25" opacity="0.9"/>

    <!-- Sparkles on Teeth -->
    <g fill="#38bdf8">
      <polygon points="-12,-85 -10,-75 -12,-65 -14,-75" transform="rotate(20 -12 -75)"/>
      <polygon points="12,-85 14,-75 12,-65 10,-75" transform="rotate(-20 12 -75)"/>
      <polygon points="68,-70 70,-60 68,-50 66,-60" transform="rotate(45 68 -60)"/>
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(40, 370)">
    <rect width="360" height="50" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc">CHỈNH NHA TRONG SUỐT INVISALIGN</text>
    <text x="20" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#94a3b8">Nụ cười đều đẹp thẩm mỹ không lộ mắc cài</text>
  </g>
</svg>