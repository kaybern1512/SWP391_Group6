<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgWisdom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgWisdom)"/>
  
  <!-- Jawbone Base -->
  <path d="M0,280 C200,280 400,260 800,290 L800,450 L0,450 Z" fill="url(#boneGrad)" opacity="0.3"/>
  <path d="M0,310 C300,300 550,290 800,320 L800,450 L0,450 Z" fill="url(#boneGrad)" opacity="0.4"/>

  <!-- Normal Molar 6 -->
  <g transform="translate(180, 160)">
    <rect x="0" y="30" width="90" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M15,140 L10,230 L35,230 L40,140 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M50,140 L55,230 L80,230 L75,140 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="45" y="85" font-family="Arial" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">RĂNG 6</text>
  </g>

  <!-- Normal Molar 7 -->
  <g transform="translate(300, 160)">
    <rect x="0" y="30" width="90" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M15,140 L10,230 L35,230 L40,140 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M50,140 L55,230 L80,230 L75,140 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="45" y="85" font-family="Arial" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">RĂNG 7</text>
  </g>

  <!-- Horizontal Impacted Wisdom Tooth #8 (Tilted 90 degrees hitting Tooth #7) -->
  <g transform="translate(480, 260) rotate(-75)">
    <rect x="0" y="0" width="85" height="105" rx="15" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <path d="M15,105 L10,190 L35,190 L40,105 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <path d="M50,105 L55,190 L75,190 L70,105 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="42" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">RĂNG 8</text>
  </g>

  <!-- Collision / Warning Icon -->
  <g transform="translate(400, 210)">
    <circle cx="15" cy="15" r="22" fill="#ef4444" opacity="0.3"/>
    <circle cx="15" cy="15" r="16" fill="#ef4444"/>
    <text x="15" y="21" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  </g>

  <!-- Piezotome Ultrasonic Surgical Tip -->
  <g transform="translate(560, 100)">
    <path d="M10,0 L25,0 L18,120 L8,135 L4,130 L10,0 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <!-- Ultrasonic Waves -->
    <path d="M2,145 Q-15,150 0,165" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <path d="M10,148 Q0,160 15,175" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,150 Q12,165 25,180" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <text x="35" y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf">Đầu sóng Piezotome</text>
    <text x="35" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#99f6e4">Bảo tồn xương & Không đau</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(40, 370)">
    <rect width="360" height="50" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#2dd4bf">NHỔ RĂNG KHÔN PIEZOTOME</text>
    <text x="20" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#94a3b8">Sóng siêu âm cao tần hạn chế tối đa sưng đau</text>
  </g>
</svg>