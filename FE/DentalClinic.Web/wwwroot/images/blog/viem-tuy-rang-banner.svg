<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgTooth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="enamelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dentinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="pulpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgTooth)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- 3D Molars / Tooth Anatomy Cross Section -->
  <g transform="translate(240, 40)">
    <!-- Enamel Outer Shell -->
    <path d="M80,80 C80,20 160,20 200,50 C240,20 320,20 320,80 C320,150 300,200 290,260 C280,310 270,360 260,370 C250,380 235,370 230,340 C220,280 215,220 200,220 C185,220 180,280 170,340 C165,370 150,380 140,370 C130,360 120,310 110,260 C100,200 80,150 80,80 Z" fill="url(#enamelGrad)" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Dentin Layer -->
    <path d="M100,90 C100,45 160,45 200,70 C240,45 300,45 300,90 C300,150 280,195 275,250 C265,300 255,340 250,350 C245,355 238,345 235,325 C225,270 215,205 200,205 C185,205 175,270 165,325 C162,345 155,355 150,350 C145,340 135,300 125,250 C120,195 100,150 100,90 Z" fill="url(#dentinGrad)" stroke="#eab308" stroke-width="1.5" opacity="0.95"/>

    <!-- Pulp Chamber & Root Canals (Infected Inflammation Glow) -->
    <path d="M150,110 C150,85 180,80 200,95 C220,80 250,85 250,110 C250,140 235,160 230,200 C225,245 228,290 228,320 C228,328 223,328 222,320 C218,290 212,240 208,180 C208,170 192,170 192,180 C188,240 182,290 178,320 C177,328 172,328 172,320 C172,290 175,245 170,200 C165,160 150,140 150,110 Z" fill="url(#pulpGrad)" filter="url(#glow)"/>

    <!-- Pain / Inflammation Pulses -->
    <circle cx="200" cy="115" r="14" fill="#ef4444" opacity="0.6"/>
    <circle cx="200" cy="115" r="24" fill="none" stroke="#f87171" stroke-width="2" opacity="0.7"/>
    <circle cx="200" cy="115" r="34" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Labels & Pointers -->
    <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      <!-- Men rang -->
      <line x1="60" y1="70" x2="110" y2="85" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="110" cy="85" r="3" fill="#38bdf8"/>
      <rect x="-40" y="55" width="95" height="26" rx="6" fill="#0284c7" opacity="0.9"/>
      <text x="7" y="72" text-anchor="middle">Men răng</text>

      <!-- Nga rang -->
      <line x1="60" y1="140" x2="130" y2="150" stroke="#facc15" stroke-width="2"/>
      <circle cx="130" cy="150" r="3" fill="#facc15"/>
      <rect x="-40" y="125" width="95" height="26" rx="6" fill="#ca8a04" opacity="0.9"/>
      <text x="7" y="142" text-anchor="middle">Ngà răng</text>

      <!-- Tuy rang -->
      <line x1="340" y1="110" x2="235" y2="120" stroke="#f87171" stroke-width="2"/>
      <circle cx="235" cy="120" r="3" fill="#f87171"/>
      <rect x="345" y="98" width="125" height="26" rx="6" fill="#b91c1c" opacity="0.9"/>
      <text x="407" y="115" text-anchor="middle">Tủy răng viêm</text>

      <!-- Ong tuy -->
      <line x1="340" y1="260" x2="225" y2="260" stroke="#f87171" stroke-width="2"/>
      <circle cx="225" cy="260" r="3" fill="#f87171"/>
      <rect x="345" y="248" width="125" height="26" rx="6" fill="#0369a1" opacity="0.9"/>
      <text x="407" y="265" text-anchor="middle">Ống tủy chân răng</text>
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(40, 370)">
    <rect width="320" height="50" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">ĐIỀU TRỊ VIÊM TỦY RĂNG</text>
    <text x="20" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#94a3b8">Quy trình nội nha 5 bước chuẩn Y Khoa</text>
  </g>

  <!-- 3D Patient Education Badge -->
  <g transform="translate(630, 30)">
    <rect width="140" height="30" rx="15" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="19" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">MÔ HÌNH 3D NỘI NHA</text>
  </g>
</svg>